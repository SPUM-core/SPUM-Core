<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青囊生活管家</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F0E8;
    --surface: #FFFFFF;
    --text: #2C2C2C;
    --text-secondary: #8A7E72;
    --accent: #2D5A5A;
    --accent-light: #E8F0EE;
    --border: #E8E0D4;
    --user-bg: #E8F0EE;
    --bot-bg: #FFFFFF;
    --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif;
    --font-sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', sans-serif;
  }
  html { font-size: 16px; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    box-shadow: 0 0 40px rgba(0,0,0,0.04);
    position: relative;
  }
  @media (max-width: 720px) { .container { max-height: 100vh; } }

  /* 顶栏 */
  .header {
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .header-icon {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: white; flex-shrink: 0;
  }
  .header-info { flex: 1; min-width: 0; }
  .header-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
  }
  .header-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 0;
  }
  .header-right {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .header-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
    white-space: nowrap;
  }
  .header-btn:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* 消息区 */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    line-height: 1.6;
    font-size: 14px;
    animation: fadeIn 0.3s ease;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    border-radius: 14px 14px 4px 14px;
    color: var(--text);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bg);
    border-radius: 14px 14px 14px 4px;
    border: 1px solid var(--border);
  }
  .msg.bot .sender {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .msg.bot .sender::before {
    content: '●';
    font-size: 7px;
    color: var(--accent);
  }
  .msg p { margin: 0; }
  .msg p + p { margin-top: 6px; }

  /* 输入区 */
  .input-area {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    background: var(--surface);
  }
  .input-area textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: var(--font-sans);
    resize: none;
    outline: none;
    transition: border-color 0.15s;
    min-height: 42px;
    max-height: 120px;
    background: var(--bg);
  }
  .input-area textarea:focus {
    border-color: var(--accent);
    background: white;
  }
  .input-area button {
    width: 42px; height: 42px;
    border: none;
    background: var(--accent);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .input-area button:hover { background: #1F4A4A; }
  .input-area button:active { transform: scale(0.95); }
  .input-area button:disabled { background: var(--border); cursor: not-allowed; }
  .input-area .voice-btn {
    background: var(--border);
    color: var(--text-secondary);
    font-size: 16px;
  }
  .input-area .voice-btn:hover { background: var(--accent-light); color: var(--accent); }
  .input-hint {
    font-size: 11px;
    color: var(--text-secondary);
    padding: 0 24px 6px;
    text-align: right;
    flex-shrink: 0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .thinking {
    align-self: flex-start;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 14px 14px 14px 4px;
    display: flex;
    gap: 4px;
    align-items: center;
    animation: fadeIn 0.2s ease;
  }
  .thinking span {
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .thinking span:nth-child(1) { animation-delay: 0s; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: var(--text-secondary);
    text-align: center;
    padding: 40px;
  }
  .empty-state .icon { font-size: 42px; margin-bottom: 14px; }
  .empty-state h2 { font-family: var(--font-serif); font-size: 20px; color: var(--accent); margin-bottom: 6px; }
  .empty-state p { font-size: 13px; max-width: 340px; line-height: 1.6; }

  .msg.bot strong { color: var(--accent); }
  .msg.bot hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- 顶栏 -->
  <div class="header">
    <div class="header-icon">🌿</div>
    <div class="header-info">
      <div class="header-title">青囊生活管家</div>
      <div class="header-subtitle">生活指导 · 衣食住行</div>
    </div>
    <div class="header-right">
      <button class="header-btn" id="resetBtn">↺ 新对话</button>
    </div>
  </div>

  <!-- 消息区 -->
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="icon">🌿</div>
      <h2>青囊</h2>
      <p>
        告诉我你的体质情况，我来帮你分析。<br>
        也可以聊聊你的家人，我会自动识别并建档。
      </p>
    </div>
  </div>

  <!-- 输入区 -->
  <div class="input-area">
    <textarea id="input" rows="1" placeholder="说说你的情况…" maxlength="2000"></textarea>
    <button class="voice-btn" id="voiceBtn" title="上传语音闻诊">🎤</button>
    <button id="sendBtn">↵</button>
    <input type="file" id="audioInput" accept=".m4a,.mp3,.wav,.mp4,.aac,.ogg" style="display:none">
  </div>
  <div class="input-hint">Enter 发送 · Shift+Enter 换行 · 🎤 上传语音</div>
</div>

<script>
// ── 状态 ──
let accountId = localStorage.getItem('qn_account_id') || '';
let isProcessing = false;

// ── DOM ──
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');
const voiceBtn = document.getElementById('voiceBtn');
const audioInput = document.getElementById('audioInput');

// ── 工具 ──
function scrollToBottom() { setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 50); }
function formatText(t) { return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/---/g,'<hr>').replace(/\n/g,'<br>'); }
function escapeHtml(t) { return t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }

function addMessage(content, role) {
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'bot') {
    div.innerHTML = `<div class="sender">青囊</div><p>${formatText(content)}</p>`;
  } else {
    div.innerHTML = `<p>${escapeHtml(content)}</p>`;
  }
  messagesEl.appendChild(div);
  scrollToBottom();
}

function showThinking() {
  const d = document.createElement('div'); d.className='thinking'; d.id='thinkingIndicator';
  d.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(d); scrollToBottom();
}
function removeThinking() { const e=document.getElementById('thinkingIndicator'); if(e)e.remove(); }

// ── 发送消息 ──
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isProcessing) return;
  inputEl.value = ''; inputEl.style.height = 'auto';
  isProcessing = true; sendBtn.disabled = true;

  addMessage(text, 'user');
  showThinking();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, account_id: accountId }),
    });
    const data = await resp.json();
    removeThinking();

    // 保存账户 ID
    accountId = data.account_id;
    localStorage.setItem('qn_account_id', accountId);

    addMessage(data.reply, 'bot');
  } catch(err) {
    removeThinking();
    addMessage('网络错误：' + err.message, 'bot');
  } finally {
    isProcessing = false; sendBtn.disabled = false; inputEl.focus();
  }
}

// ── 语音闻诊 ──
function formatVoiceReport(data) {
  let html = `<div class="sender">青囊 · 闻诊分析</div>
<p><strong>声域分型：</strong>${data.voice_label}</p>
<p><strong>特征：</strong>${data.voice_description}</p>
<hr>
<p><strong>声学特征</strong><br>
基频：${data.f0_mean_hz} Hz（${data.harmonic_mode}）<br>
谱质心：${data.spectral_centroid_hz} Hz<br>
RMS 能量：${data.rms_energy}</p>
<hr>
<p><strong>五音频段能量</strong><br>`;
  if (data.five_tone_bands) {
    for (const [band, val] of Object.entries(data.five_tone_bands)) {
      html += `${band}: ${val}%<br>`;
    }
  }
  html += `</p><hr><p><strong>闻诊 S 向量修正</strong><br>`;
  if (data.s_vector_auscultation) {
    for (const [k, v] of Object.entries(data.s_vector_auscultation)) {
      html += `${k} = ${v}<br>`;
    }
  }
  html += `</p>`;
  return html;
}

async function sendAudio(file) {
  if (isProcessing) return;
  isProcessing = true; sendBtn.disabled = true; voiceBtn.disabled = true;

  addMessage(`[上传语音] ${file.name}`, 'user');
  showThinking();

  try {
    const formData = new FormData();
    formData.append('file', file);
    const resp = await fetch('/api/analyze/voice', { method: 'POST', body: formData });
    const data = await resp.json();
    removeThinking();

    if (data.error) {
      addMessage('闻诊分析失败：' + (data.detail || data.error), 'bot');
    } else {
      addMessage(formatVoiceReport(data), 'bot');
    }
  } catch(err) {
    removeThinking();
    addMessage('网络错误：' + err.message, 'bot');
  } finally {
    isProcessing = false; sendBtn.disabled = false; voiceBtn.disabled = false;
    inputEl.focus();
  }
}

// ── 重置 ──
async function resetChat() {
  if (accountId) {
    await fetch(`/api/chat/reset/${accountId}`, { method: 'POST' });
  }
  messagesEl.querySelectorAll('.msg, .thinking').forEach(el => el.remove());
  emptyState.style.display = 'flex';
  inputEl.value = ''; inputEl.focus();
}

// ── 事件 ──
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });
inputEl.addEventListener('input', () => { inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,120)+'px'; });
resetBtn.addEventListener('click', resetChat);
voiceBtn.addEventListener('click', () => audioInput.click());
audioInput.addEventListener('change', () => {
  if (audioInput.files.length > 0) { sendAudio(audioInput.files[0]); audioInput.value = ''; }
});

// ── 初始化 ──
inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
inputEl.focus();
</script>
</body>
</html>
