[project]
name = "qingmeng-engine"
version = "0.1.0"
description = "青檬引擎 — 基于 SPUM 内化的复杂系统推理引擎"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SPUM Core" }]
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qingmeng*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
