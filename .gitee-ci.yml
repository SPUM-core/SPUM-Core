version: '1.0'
name: SPUM-CI

triggers:
  push:
    branches:
      include:
        - master
  pull_request:
    branches:
      include:
        - master

stages:
  - name: 评分与版本生成
    jobs:
      - name: run-score
        runs-on: ubuntu-latest
        steps:
          - name: 检出代码
            uses: checkout@v1
          - name: 安装 Python 和依赖
            script: |
              apt-get update
              apt-get install -y python3 python3-pip jq
              pip3 install -r tools/requirements.txt
          - name: 运行 SPUM 评分
            script: python3 tools/score_calculator.py core/v1.0/theory.md theory
          - name: 生成 Merkle 根
            script: python3 tools/hash_validator.py generate core/v1.0
          - name: 生成版本号并写入 version.json
            script: |
              A=$(jq -r '.A' score_result.json)
              B=$(jq -r '.B' score_result.json)
              C=$(jq -r '.C' score_result.json)
              D=$(jq -r '.D' score_result.json)
              LE=$(jq -r '.LE' score_result.json)
              MERKLE_PREFIX=$(jq -r '.merkle_prefix' merkle_result.json)
              TIMESTAMP=$(date +%s)
              VERSION="3c7e9a2b.theory.${A}.${B}.${C}.${D}.${LE}.${MERKLE_PREFIX}.${TIMESTAMP}"
              echo "生成的版本号: $VERSION"
              cat > core/v1.0/version.json << EOF
              {
                "version": "$VERSION",
                "content_type": "theory",
                "merkle_root": "$(jq -r '.merkle_root' merkle_result.json)",
                "timestamp": $TIMESTAMP,
                "score": {"A": $A, "B": $B, "C": $C, "D": $D, "LE": $LE}
              }
              EOF
          - name: 上传 version.json 为制品
            uses: artifacts-upload@v1
            with:
              path: core/v1.0/version.json