version: '1.0'
name: SPUM-CI

triggers:
  push:
    branches:
      include:
        - master
  pull_request:
    branches:
      include:
        - master

stages:
  - name: 单元测试
    jobs:
      - name: run-tests
        runs-on: ubuntu-latest
        steps:
          - name: 检出代码
            uses: checkout@v1
          - name: 运行单元测试
            script: |
              apt-get update
              apt-get install -y python3 python3-pip
              python3 -m unittest discover -s tests -v
              python3 tools/repro_core_invariants.py --frames 200 --steps 5000

  - name: 评分与版本生成（信息性）
    jobs:
      - name: run-score
        runs-on: ubuntu-latest
        steps:
          - name: 检出代码
            uses: checkout@v1
          - name: 安装 Python 和依赖
            script: |
              apt-get update
              apt-get install -y python3 python3-pip jq
          - name: 运行 SPUM 评分
            script: python3 tools/score_calculator.py knowledge.md theory
          - name: 校验文档哈希
            script: python3 tools/hash_validator.py generate knowledge.md || echo "哈希校验跳过"
