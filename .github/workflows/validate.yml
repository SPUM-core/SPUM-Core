name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ── 主闸门：单元测试 ──────────────────────────────────────
  test:
    name: 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行单元测试
        run: |
          python -m unittest discover -s tests -v

      - name: 复现核心拓扑不变量
        run: |
          python tools/repro_core_invariants.py --frames 200 --steps 5000

  # ── 评分作业：四维评审 + 版本号（信息性，不阻塞合并） ────
  score:
    name: 四维评分与版本号
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true  # 评分结果仅作报告，不阻塞 CI
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 评分核心理论文档
        run: |
          python tools/score_calculator.py knowledge.md theory
          cat score_result.json

      - name: 评分完整理论正文
        run: |
          python tools/score_calculator.py SPUM2610.md theory
          cat score_result.json

      - name: 校验文档哈希
        run: |
          python tools/hash_validator.py generate knowledge.md || echo "哈希校验跳过（无待处理变更）"
